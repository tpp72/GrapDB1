# Visual system: see DESIGN.md. The same tokens are mirrored as CSS variables in app.py.

[theme]
base = "light"
primaryColor = "#0A7A5A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EEF2F0"
textColor = "#111A17"
linkColor = "#0A7A5A"
borderColor = "#C3CEC9"
font = "Anuphan:https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap, sans-serif"
baseFontSize = 16
headingFontSizes = ["2rem", "1.5rem", "1.2rem", "1.05rem", "1rem", "1rem"]
headingFontWeights = [700, 700, 600, 600, 600, 600]
baseRadius = "0.375rem"
buttonRadius = "0.375rem"
showWidgetBorder = true
showSidebarBorder = false
dataframeBorderColor = "#DCE3E0"
dataframeHeaderBackgroundColor = "#EEF2F0"
chartCategoricalColors = ["#0A7A5A", "#5B3FA6", "#B8500A"]

[theme.sidebar]
backgroundColor = "#10201A"
secondaryBackgroundColor = "#1C2F28"
textColor = "#F2F6F4"
primaryColor = "#6FD9AE"
borderColor = "#35493F"
